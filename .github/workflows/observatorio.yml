name: Observatorio

# Corre todos los lunes a las 06:00 de Buenos Aires (09:00 UTC) y también a mano.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observatorio
  cancel-in-progress: false

jobs:
  actualizar:
    name: Relevar y publicar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Correr el observatorio
        run: python -m tools.observatorio.construir

      - name: Publicar si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Sin cambios en esta corrida."
            exit 0
          fi
          git commit -m "observatorio: corrida $(date -u +%Y-%m-%d)"
          git push
